---
configure_dotfiles: true
stow_dotfiles: true
configure_dock: true
configure_sudoers: false
configure_terminal: false
configure_osx: true
configure_sublime: false

homebrew_installed_packages:
  - ansible
  - bat
  - bun
  - crush
  - dockutil
  - eza
  - fzf
  - gh
  - git
  - glow
  - go
  - gum
  - iperf3
  - kompose
  - mas
  - mise
  - neovim
  - nmap
  - opencode
  - opentofu
  - pnpm
  - podlet
  - python
  - sqlite
  - starship
  - stow
  - tailscale
  - uv
  - wget
  - zoxide

homebrew_cask_apps:
  - brave-browser
  - brave-browser@beta
  - bruno
  - db-browser-for-sqlite
  - discord
  - font-hack-nerd-font
  - ghostty
  - localsend
  - maccy
  - monitorcontrol
  - netbird-ui
  - orbstack
  - raspberry-pi-imager
  - rectangle
  - rustdesk
  - scroll-reverser
  - signal
  - signal@beta
  - visual-studio-code
  - vscodium
  - zed
  - zoom

mas_installed_apps:
  - { id: 1352778147, name: "Bitwarden" }
  - { id: 1502839586, name: "Hand Mirror" }

dotfiles_repo: https://github.com/Jacob-Roberts/dotfiles.git
dotfiles_repo_local_destination: ~/.dotfiles
dotfiles_repo_version: main

dockitems_remove:
  - TV
  - Podcasts
  - "App Store"
  - "iPhone Mirroring"
  - Maps
  - Photos
  - FaceTime
  - Contacts
  - Freeform
  - Music
  - News
  - Safari
dockitems_persist:
  - name: "Launchpad"
    path: "/Applications/Launchpad.app"
    pos: 1
  - name: "Calendar"
    path: "/Applications/Calendar.app"
    post: 2
  - name: "Brave Browser"
    path: "/Applications/Brave Browser.app"
    pos: 3
  - name: "Reminders"
    path: "/Applications/Reminders.app"
    pos: 4
  - name: "Music"
    path: "/Applications/Music.app"
    pos: 5
  - name: "WhatsApp"
    path: "/Applications/WhatsApp.app"
    pos: 6
  - name: "Signal"
    path: "/Applications/Signal.app"
    pos: 7
  - name: "Messages"
    path: "/Applications/Messages.app"
    pos: 8
  - name: "Notes"
    path: "/Applications/Notes.app"
    pos: 9
  - name: "" # Spacer
    path: ""
    pos: 10
  - name: "Youtube Music"
    path: "~/Applications/Brave Browser Beta Apps/YouTube Music.app"
    pos: 11
  - name: "Brave Browser Beta"
    path: "/Applications/Brave Browser Beta.app"
    pos: 12
  - name: "Ghostty"
    path: "/Applications/Ghostty.app"
    pos: 13
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app"
    pos: 14
  - name: "Signal Beta"
    path: "/Applications/Signal Beta.app"
    pos: 15
  - name: "WhatsApp Web"
    path: "~/Applications/Brave Browser Beta Apps/WhatsApp Web.app"
    pos: 16
  - name: "Discord"
    path: "/Applications/Discord.app"
    pos: 17
  - name: "System Settings"
    path: "/Applications/System Settings.app"
    pos: 18

